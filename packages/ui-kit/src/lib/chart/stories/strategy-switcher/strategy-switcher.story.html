<h3>Interactive Strategy Switcher</h3>
<div class="controls">
  @for (name of strategyNames; track name) {
  <ui-button [variant]="activeName() === name ? 'filled' : 'outlined'" (click)="setStrategy(name)">
    {{ name }}
  </ui-button>
  }
</div>
<h4>Coloring</h4>
<div class="controls">
  @for (name of coloringNames; track name) {
  <ui-button [variant]="activeColoringName() === name ? 'filled' : 'outlined'" (click)="setColoring(name)">
    {{ name }}
  </ui-button>
  }
</div>
<ui-chart [source]="data" labelProperty="month" valueProperty="revenue" [strategy]="activeStrategy()"
  [coloring]="activeColoring()" [width]="width()" [height]="height()" [showLegend]="showLegend()"
  [ariaLabel]="ariaLabel()" />
<p>
  Active renderer: <strong>{{ activeName() }}</strong>. Active coloring:
  <strong>{{ activeColoringName() }}</strong>.
</p>
