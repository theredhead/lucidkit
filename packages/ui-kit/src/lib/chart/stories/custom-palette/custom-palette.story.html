<h3>Custom Warm Palette</h3>
<ui-chart [source]="data" labelProperty="month" valueProperty="revenue" [strategy]="strategy" [coloring]="coloring"
  [width]="width()" [height]="height()" [showLegend]="showLegend()" [ariaLabel]="ariaLabel()" />
<p>
  The palette is provided through <code>PaletteChartColoringStrategy</code>.
  Colours cycle if data exceeds the palette length.
</p>
