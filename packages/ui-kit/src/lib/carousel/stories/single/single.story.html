<ui-carousel
  [items]="photos"
  [strategy]="strategy"
  [(activeIndex)]="active"
  [showControls]="showControls()"
  [showIndicators]="showIndicators()"
  [wrap]="wrap()"
>
  <ng-template let-photo>
    <div class="frame">
      <img [src]="photo.url" [alt]="photo.name" />
    </div>
  </ng-template>
</ui-carousel>
