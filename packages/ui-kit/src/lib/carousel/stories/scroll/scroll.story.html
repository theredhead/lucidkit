<ui-carousel
  [items]="photos"
  [strategy]="strategy()"
  [(activeIndex)]="active"
  [showControls]="showControls()"
  [showIndicators]="showIndicators()"
  [wrap]="wrap()"
>
  <ng-template let-photo>
    <div class="slide">
      <img [src]="photo.url" [alt]="photo.name" />
      <p class="caption">{{ photo.name }}</p>
    </div>
  </ng-template>
</ui-carousel>
