<main>
    <h2>Inline gallery without a filmstrip</h2>
    <p>Navigation uses only the previous and next controls.</p>
    <div class="frame">
        <ui-media-gallery [inline]="true" [items]="items" [idleDelay]="idleDelay()" [showFilmstrip]="showFilmstrip()"
            [transition]="transition()" />
    </div>
</main>
