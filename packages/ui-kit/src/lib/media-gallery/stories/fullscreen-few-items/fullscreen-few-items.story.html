<ui-media-gallery [idleDelay]="idleDelay()" [showFilmstrip]="showFilmstrip()" [transition]="transition()" />

<main>
    <h2>Fullscreen gallery with a few items</h2>
    <p>Open any item to browse a compact mixed-media collection.</p>
    <div class="grid">
        @for (image of images; track image.src) {
        <ui-image gallery="few" [src]="image.src" [alt]="image.alt" [width]="280" [height]="190" />
        }
        <ui-media-player gallery="few" type="video" [source]="videoSource" poster="/media/sample-poster.jpg"
            ariaLabel="Sample gallery video" />
    </div>
</main>
