<main>
    <h2>Inline gallery with many items</h2>
    <p>Thirty previews overflow the constrained filmstrip.</p>
    <div class="frame">
        <ui-media-gallery [inline]="true" [items]="items" [idleDelay]="idleDelay()" [showFilmstrip]="showFilmstrip()"
            [transition]="transition()" />
    </div>
</main>
