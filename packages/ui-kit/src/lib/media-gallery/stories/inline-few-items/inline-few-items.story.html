<main>
    <h2>Inline gallery with a few items</h2>
    <p>The filmstrip is enabled by default in constrained mode.</p>
    <div class="frame">
        <ui-media-gallery [inline]="true" [items]="items" [idleDelay]="idleDelay()" [showFilmstrip]="showFilmstrip()"
            [transition]="transition()" />
    </div>
</main>
