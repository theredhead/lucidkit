<ui-media-gallery [idleDelay]="idleDelay()" [showFilmstrip]="showFilmstrip()" />

<main>
    <h2>Fullscreen gallery with many items</h2>
    <p>The thirty-item collection forces the filmstrip to overflow horizontally.</p>
    <div class="grid">
        @for (image of images; track image.src) {
        <ui-image gallery="many" [src]="image.src" [alt]="image.alt" [width]="220" [height]="150" />
        }
    </div>
</main>
