@if (isVisible() && activeItem(); as active) {
<div class="backdrop" [class.inline-viewer]="isInlineView()" tabindex="-1" (click)="onBackdropClick($event)"
    (keydown.enter)="onBackdropKeydown($event)">
    <section class="viewer" [class.inline-viewer]="isInlineView()" [class.left-close]="closePosition() === 'left'"
        [class.cursor-hidden]="cursorHidden()" [attr.role]="isInlineView() ? null : 'dialog'"
        [attr.aria-modal]="isInlineView() ? null : 'true'" [attr.aria-label]="ariaLabel()"
        (pointermove)="onViewerPointerMove($event)" (pointerdown)="onViewerPointerMove($event)">
        @if (!isInlineView()) {
        <button type="button" class="close" [class.visible]="controlsVisible()" aria-label="Close" (click)="close()">
            <ui-icon [svg]="icons.close" [size]="22" ariaLabel="Close" />
        </button>
        }

        @if (canPrevious()) {
        <button type="button" class="navigate previous" [class.visible]="controlsVisible()" aria-label="Previous"
            (click)="onPrevious()">
            <ui-icon [svg]="icons.previous" [size]="28" ariaLabel="Previous" />
        </button>
        }

        <div #stage class="stage" [attr.role]="isInlineView() ? 'button' : null"
            [attr.tabindex]="isInlineView() ? 0 : null"
            [attr.aria-label]="isInlineView() ? 'Open ' + (active.alt || 'media') + ' fullscreen' : null"
            (wheel)="onWheel($event)" (dblclick)="onDoubleClick()" (pointerdown)="onPointerDown($event)"
            (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()"
            (click)="onStageClick($event)" (keydown.enter)="expandInline($event)"
            (keydown.space)="expandInline($event)">
            @for (item of [active]; track item.id) {
            <div class="media-frame" [class.transition-fade]="hasNavigated() && transition() === 'fade'"
                [class.transition-slide]="hasNavigated() && transition() === 'slide'"
                [class.transition-zoom]="hasNavigated() && transition() === 'zoom'"
                [class.forward]="hasNavigated() && transition() !== 'none' && transitionDirection() === 'forward'"
                [class.backward]="hasNavigated() && transition() !== 'none' && transitionDirection() === 'backward'">
                @if (item.kind === "image") {
                <img class="media image" [class.cover]="isInlineView()" [class.contain]="!isInlineView()"
                    [src]="item.src" [alt]="item.alt ?? ''" [style.transform]="transform()" />
                } @else {
                <ui-media-player class="media video" type="video" [source]="{ url: item.src, type: item.type }"
                    [poster]="item.poster ?? ''" [ariaLabel]="item.alt ?? 'Video'" />
                }
            </div>
            }
        </div>

        @if (canNext()) {
        <button type="button" class="navigate next" [class.visible]="controlsVisible()" aria-label="Next"
            (click)="onNext()">
            <ui-icon [svg]="icons.next" [size]="28" ariaLabel="Next" />
        </button>
        }

        @if (showFilmstrip()) {
        <nav class="filmstrip" [class.visible]="controlsVisible()" aria-label="Media previews">
            @for (item of activeItems(); track item.id; let index = $index) {
            <button type="button" class="preview" [class.active]="index === activeIndex()"
                [attr.aria-label]="'Open ' + (item.alt || 'media ' + (index + 1))"
                [attr.aria-current]="index === activeIndex() ? 'true' : null" (click)="selectItem(index, item.id)">
                @if (item.kind === "image" || item.poster) {
                <img [src]="item.kind === 'image' ? item.src : item.poster" [alt]="item.alt ?? ''" />
                } @else {
                <span aria-hidden="true">Video</span>
                }
            </button>
            }
        </nav>
        }
    </section>
</div>
}
