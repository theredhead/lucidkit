
<div class="stack">
  <div>
    <h4 class="label">Linear determinate</h4>
    <ui-progress
      [variant]="variant()"
      [mode]="mode()"
      [value]="val()"
      [ariaLabel]="ariaLabel()"
    />
    <ui-slider
      [(value)]="val"
      [showValue]="true"
      ariaLabel="Progress value"
      class="slider"
    />
  </div>
  <div>
    <h4 class="label">Linear indeterminate</h4>
    <ui-progress mode="indeterminate" />
  </div>
  <div class="row">
    <div>
      <h4 class="label">Circular</h4>
      <ui-progress variant="circular" [value]="val()" />
    </div>
    <div>
      <h4 class="label">Circular indeterminate</h4>
      <ui-progress variant="circular" mode="indeterminate" />
    </div>
  </div>
</div>
