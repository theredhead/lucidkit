<ui-toolbar>
  <ui-button-tool id="zoom-out" [icon]="UIIcons.Lucide.Accessibility.ZoomOut" tooltip="Zoom out" (toolAction)="zoomOut()" />
  <ui-template-tool id="zoom-display">
    <ng-template let-tool>
      <span class="zoom-label">{{ zoom() }}%</span>
    </ng-template>
  </ui-template-tool>
  <ui-button-tool id="zoom-in" [icon]="UIIcons.Lucide.Accessibility.ZoomIn" tooltip="Zoom in" (toolAction)="zoomIn()" />
</ui-toolbar>
