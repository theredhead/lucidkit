<div class="gauges">
  <ui-gauge [value]="speed()" [strategy]="analog" unit="km/h" [zones]="zones" />
  <ui-gauge [value]="speed()" [strategy]="vu" unit="km/h" [zones]="zones" [width]="100" [height]="240" />
  <ui-gauge [value]="speed()" [strategy]="digital" unit="km/h" [width]="200" [height]="120" />
</div>

<div class="controls">
  @if (!usingMic()) {
    <span class="speed-label">{{ speed() }} km/h</span>
    <input
      type="range"
      min="0"
      max="220"
      [value]="speed()"
      (input)="onSliderChange($event)"
      aria-label="Speed"
    />
  }
  <button type="button" (click)="toggleMic()">
    @if (usingMic()) { Stop microphone } @else { Use microphone }
  </button>
  @if (micError()) {
    <span class="mic-error">{{ micError() }}</span>
  }
</div>
