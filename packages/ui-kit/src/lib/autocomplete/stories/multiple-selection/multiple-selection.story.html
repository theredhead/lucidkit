
    <ui-autocomplete
      [datasource]="ds"
      [(value)]="selected"
      [multiple]="true"
      [placeholder]="placeholder()"
      [minChars]="minChars()"
      [disabled]="disabled()"
      [ariaLabel]="ariaLabel()"
      (itemSelected)="itemSelected.emit($event)"
      (itemRemoved)="itemRemoved.emit($event)"
    />
    <ui-json-view [value]="selected()" ariaLabel="Selected items" />
