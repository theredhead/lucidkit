<div
  class="viewport"
  [class.interactive]="isInteractive()"
  [class.dragging]="isDragging()"
  [class.dark-tiles]="darkModeTiles()"
  [attr.role]="viewportRole()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-roledescription]="isInteractive() ? 'interactive map' : null"
  [attr.tabindex]="viewportTabIndex()"
  (wheel)="onWheel($event)"
  (mousedown)="onMouseDown($event)"
  (click)="onViewportClick($event)"
  (dblclick)="onDoubleClick($event)"
  (keydown)="onKeyDown($event)"
>
  <!-- Tile images -->
  @for (tile of tiles(); track tile.key) {
    <img
      class="tile"
      [src]="tile.url"
      [style.left.px]="tile.left"
      [style.top.px]="tile.top"
      width="256"
      height="256"
      alt=""
      draggable="false"
    />
  }

  <!-- SVG overlay for polylines and polygons -->
  @if (hasVectorOverlays()) {
    <svg class="vectors" [attr.viewBox]="svgViewBox()">
      <!-- Polygons (behind polylines) -->
      @for (polygon of renderedPolygons(); track $index) {
        <path
          [attr.d]="polygon.path"
          [attr.fill]="polygon.fill"
          [attr.fill-opacity]="polygon.fillOpacity"
          [attr.stroke]="polygon.stroke"
          [attr.stroke-width]="polygon.strokeWidth"
        />
      }

      <!-- Polylines -->
      @for (polyline of renderedPolylines(); track $index) {
        <path
          [attr.d]="polyline.path"
          fill="none"
          [attr.stroke]="polyline.stroke"
          [attr.stroke-width]="polyline.strokeWidth"
          [attr.stroke-dasharray]="polyline.dashArray"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      }

      @for (editableShape of renderedEditableShapes(); track editableShape.key) {
        <path
          class="editable-shape"
          [class.line]="editableShape.shape === 'line'"
          [class.polygon]="editableShape.shape === 'polygon'"
          [attr.d]="editableShape.path"
          [attr.fill]="editableShape.fill"
          [attr.fill-opacity]="editableShape.fillOpacity"
          [attr.stroke]="editableShape.stroke"
          [attr.stroke-width]="editableShape.strokeWidth"
          [attr.stroke-linecap]="editableShape.shape === 'line' ? 'round' : null"
          [attr.stroke-linejoin]="editableShape.shape === 'line' ? 'round' : 'round'"
        />
      }
    </svg>
  }

  <svg class="editor" [attr.viewBox]="svgViewBox()" aria-hidden="true">
    @for (segment of editableSegments(); track segment.key) {
      <path
        class="edit-segment"
        [class.line]="segment.shape === 'line'"
        [class.polygon]="segment.shape === 'polygon'"
        [attr.d]="segment.path"
        (click)="onSegmentClick($event, segment)"
      />
    }

    @for (handle of editableHandles(); track handle.key) {
      <circle
        class="vertex-handle"
        [class.line]="handle.shape === 'line'"
        [class.polygon]="handle.shape === 'polygon'"
        [class.selected]="handle.selected"
        [attr.cx]="handle.x"
        [attr.cy]="handle.y"
        r="7"
        (mousedown)="onVertexMouseDown($event, handle)"
        (dblclick)="onVertexDoubleClick($event, handle)"
      />
    }
  </svg>

  <!-- Markers -->
  @for (marker of renderedMarkers(); track $index) {
    <div
      class="marker"
      [style.left.px]="marker.left"
      [style.top.px]="marker.top"
      [attr.aria-label]="marker.label"
      [attr.role]="marker.label ? 'img' : null"
    >
      @if (marker.isCustom) {
        <img
          [src]="marker.dataUri"
          [width]="marker.width"
          [height]="marker.height"
          alt=""
          draggable="false"
        />
      } @else {
        <svg
          [attr.width]="marker.width"
          [attr.height]="marker.height"
          viewBox="0 0 24 36"
          aria-hidden="true"
        >
          <path
            class="pin-body"
            d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24s12-15 12-24C24 5.373 18.627 0 12 0z"
            [style.fill]="marker.color || null"
          />
          <circle cx="12" cy="12" r="5" fill="white" opacity="0.9" />
        </svg>
      }
    </div>
  }

  <!-- Attribution -->
  @if (attribution()) {
    <div class="attribution" [innerHTML]="attribution()"></div>
  }
</div>
