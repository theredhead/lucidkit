<ui-timeline
  [datasource]="events"
  [alignment]="alignment()"
  [orientation]="orientation()"
  [ariaLabel]="ariaLabel()"
>
  <ng-template let-event let-i="index">
    <div class="event-card">
      <strong>{{ event.title }}</strong>
      <span>{{ event.date }}</span>
      <p>{{ event.description }}</p>
    </div>
  </ng-template>
</ui-timeline>
