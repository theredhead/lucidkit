<ui-timeline
  [datasource]="events"
  [alignment]="alignment()"
  [orientation]="orientation()"
  [ariaLabel]="ariaLabel()"
>
  <ng-template let-event>
    <div class="event-card">
      <strong>{{ event.title }}</strong>
      <p>{{ event.description }}</p>
    </div>
  </ng-template>
</ui-timeline>
