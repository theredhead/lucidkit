<!-- Alert -->
<ui-button (click)="showAlert()">Show Alert</ui-button>

<!-- Confirm decisions -->
<ui-button (click)="showConfirm('danger')">Delete project...</ui-button>
<ui-button (click)="showConfirm('primary')">Archive project...</ui-button>
<ui-button (click)="showConfirm('warning')">Discard changes...</ui-button>

<!-- Prompt -->
<ui-button (click)="showPrompt()">Rename...</ui-button>

<!-- Open File -->
<ui-button (click)="showOpenFile()">Open File...</ui-button>

<!-- Save File -->
<ui-button (click)="showSaveFile()">Save File...</ui-button>

<!-- About -->
<ui-button (click)="showAbout()">About...</ui-button>
