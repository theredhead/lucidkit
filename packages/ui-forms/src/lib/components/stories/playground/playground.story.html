
    <ui-form
      [engine]="engine()"
      [submitLabel]="submitLabel()"
      [showSubmit]="showSubmit()"
      (formSubmit)="onSubmit($event)"
    />

    <div class="live-panel">
      <h4 class="live-heading">
        Live output
        <span class="live-badge" [class.live-badge--valid]="engine().valid()">
          {{ engine().valid() ? "✓ valid" : "✗ invalid" }}
        </span>
      </h4>
      <ui-json-view [value]="liveOutput()" ariaLabel="Live output" />
    </div>

    @if (submitted()) {
    <h4 class="output-heading">Submitted values</h4>
      <ui-json-view [value]="submitted()" ariaLabel="Submitted values" />
    }
